[package]
name = "transfer-stats-hook"
version = "0.1.0"
edition = "2021"
description = "Token-2022 transfer hook that records transfer statistics (count, total, largest) in a per-mint PDA"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6"
solana-address = { version = "~2.7.0", features = ["decode"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "~2.7.0", features = ["decode", "curve25519"] }

[dev-dependencies]
litesvm = "0.18"
solana-account = "4.3.0"
solana-address = "~2.7.0"
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
